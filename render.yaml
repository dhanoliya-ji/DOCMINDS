
services:
  - type: web
    name: docminds-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    healthCheckPath: /api/v1/health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: INGESTION_MODE
        value: inline

      - key: SECRET_KEY
        generateValue: true

      - key: GROQ_API_KEY
        sync: false

      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_DIMENSION
        value: "384"

      - key: TRUSTED_PROXY_COUNT
        value: "1"

      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: RETRIEVAL_MIN_SCORE
        value: "0.15"

      - key: OCR_PROVIDER
        value: tesseract
      - key: TESSERACT_CMD
        value: tesseract

      - key: FRONTEND_ORIGIN
        sync: false

      # INGESTION_MODE=inline runs auto-sync inside the API (no beat needed).
