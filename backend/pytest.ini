# pytest.ini -- how the test suite is run.
#
# Run everything:            python -m pytest
# Tier 1 only (no Docker):   SKIP_DB_TESTS=1 python -m pytest
# One file:                  python -m pytest tests/test_chunker.py
# One test, verbosely:       python -m pytest tests/test_chunker.py::TestCountTokens -v

[pytest]
testpaths = tests

# `rootdir`-relative imports: this is what makes `from app.services...` work
# without installing the package or setting PYTHONPATH by hand.
pythonpath = .

# -q          quiet: one character per test rather than a line
# --tb=short  short tracebacks; the assertion and its line, not the whole stack
# --strict-markers  a typo'd @pytest.mark is an error, not a silently ignored no-op
addopts = -q --tb=short --strict-markers

# asyncio_mode=auto lets an `async def test_...` run without decorating each one.
asyncio_mode = auto

markers =
    tier2: needs a real PostgreSQL with pgvector; skipped when none is reachable
    gemini_live: calls the real Gemini API; needs GEMINI_API_KEY
