
target-version = "py311"

[lint]
select = [
    "E4", "E7", "E9",  # Ruff's defaults: import placement, statements, syntax errors
    "F",               # Pyflakes: undefined names, unused imports and variables
    "B",               # flake8-bugbear: patterns that are usually bugs
]
ignore = [
    "B008",
]
