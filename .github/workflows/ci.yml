name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgrespassword
  POSTGRES_DB: document_intelligence
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  LLM_PROVIDER: mock
  OCR_PROVIDER: mock
  SECRET_KEY: ci-only-secret-not-used-anywhere-else

jobs:
  backend:
    runs-on: ubuntu-latest
    services: &services
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: document_intelligence
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 10
    env:
      EMBEDDING_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.7"
          src: backend
      - run: alembic upgrade head
      - name: Test (fails if DB tests were skipped)
        env:
          GEMINI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          set -o pipefail
          live=""; [ -z "$GEMINI_API_KEY" ] && live="not gemini_live"
          python -m pytest ${live:+-m "$live"} | tee result.txt
          ! grep -qE "[0-9]+ skipped" result.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services: *services
    env:
      EMBEDDING_PROVIDER: local
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          (cd backend && pip install -r requirements.txt && alembic upgrade head)
          (cd frontend && npm ci && npx playwright install chromium --with-deps)
      - name: Start API and worker
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          nohup celery -A app.core.celery_app worker > /tmp/worker.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8000/api/v1/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        run: tail -80 /tmp/api.log /tmp/worker.log
